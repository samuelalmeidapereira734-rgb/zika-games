<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zika Games — Acesso</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
      font-family:Arial,Helvetica,sans-serif; color:#fff;
      background:radial-gradient(circle at top,#14264a 0,#07090d 45%,#020304 100%);
      padding:24px;
    }
    .page{width:100%;max-width:430px;text-align:center}
    .logo{
      width:125px;height:125px;object-fit:contain;border-radius:50%;
      margin:0 auto 18px;display:block;
      filter:drop-shadow(0 0 22px rgba(0,140,255,.45));
    }
    .brand{font-size:29px;font-weight:900;letter-spacing:1px;margin:0}
    .tag{color:#9aa6b8;font-size:14px;margin:8px 0 24px}
    .card{
      background:rgba(13,17,25,.92);border:1px solid #263244;border-radius:22px;
      padding:26px 20px;box-shadow:0 18px 55px rgba(0,0,0,.45);
    }
    .badge{
      display:inline-block;background:#126cff;color:#fff;font-size:12px;font-weight:800;
      padding:7px 12px;border-radius:999px;margin-bottom:14px;
    }
    h1{font-size:25px;margin:0 0 10px}
    .text{color:#b9c2cf;line-height:1.5;font-size:15px;margin:0 auto 20px}
    .ad{
      min-height:120px;border:1px dashed #455064;border-radius:14px;
      display:flex;align-items:center;justify-content:center;color:#657084;
      font-size:12px;margin:16px 0 18px;
    }
    .continue{
      width:100%;border:0;border-radius:13px;padding:16px;background:#087cff;color:white;
      font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(8,124,255,.25);
    }
    .continue:hover{filter:brightness(1.08)}
    .small{font-size:11px;color:#667185;margin-top:15px}
  </style>
</head>
<body>
  <main class="page">
    <img class="logo" src="logo.png" alt="Zika Games">
    <h2 class="brand">ZIKA GAMES</h2>
    <p class="tag">Os melhores jogos mobile em um só lugar!</p>

    <section class="card">
      <span class="badge">🎮 ACESSO GRATUITO</span>
      <h1>Seu conteúdo está quase liberado</h1>
      <p class="text">Continue para acessar nossa seleção de jogos mobile e encontrar o conteúdo que você está procurando.</p>

      <div class="ad">ESPAÇO RESERVADO PARA ANÚNCIO</div>

      <button class="continue" onclick="window.location.href='links.html'">
        CONTINUAR →
      </button>

      <p class="small">O anúncio é independente do botão de acesso.</p>
    </section>
  </main>
</body>
</html>
