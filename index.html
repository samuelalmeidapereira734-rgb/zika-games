<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zika Games - Desbloquear</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background: radial-gradient(circle at top, #14264a 0%, #070d1b 45%, #020409 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
    text-align: center;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 35px;
}

h1 {
    font-size: 42px;
    margin: 0 0 8px;
    font-weight: 900;
    letter-spacing: 1px;
}

.subtitle {
    font-size: 18px;
    color: #c9d2e5;
    margin-bottom: 28px;
}

.card {
    background: rgba(18, 27, 45, 0.94);
    border: 1px solid #35445e;
    border-radius: 24px;
    padding: 25px 20px;
    box-shadow: 0 15px 55px rgba(0,0,0,.45);
}

.badge {
    display: inline-block;
    background: #16cfff;
    color: white;
    font-weight: 800;
    padding: 10px 18px;
    border-radius: 30px;
    margin-bottom: 18px;
}

h2 {
    font-size: 27px;
    margin: 5px 0 12px;
}

.text {
    color: #d9e0ec;
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 22px;
}

.ad {
    height: 145px;
    border: 2px dashed #61718c;
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #aebbd0;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 18px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 18px;
    background: #16cfff;
    color: white;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
}

button:disabled {
    background: #536176;
    cursor: not-allowed;
}

.small {
    margin-top: 14px;
    color: #9da9bb;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🎮 Zika Games</div>

    <h1>ZIKA GAMES</h1>
    <div class="subtitle">Acesso rápido aos seus jogos</div>

    <div class="card">

        <div class="badge">🔓 ACESSO GRATUITO</div>

        <h2>Seu conteúdo está quase liberado</h2>

        <div class="text">
            Aguarde alguns segundos para liberar o acesso aos nossos jogos.
        </div>

        <div class="ad">
            ESPAÇO RESERVADO PARA ANÚNCIO
        </div>

        <button id="unlock" disabled>
            DESBLOQUEAR 5
        </button>

        <div class="small">
            O anúncio é independente do botão de acesso.
        </div>

    </div>
</div>

<script>
let segundos = 5;
const botao = document.getElementById("unlock");

const contador = setInterval(function() {

    segundos--;

    if (segundos > 0) {
        botao.textContent = "DESBLOQUEAR " + segundos;
    } else {
        clearInterval(contador);
        botao.disabled = false;
        botao.textContent = "DESBLOQUEAR →";
    }

}, 1000);

botao.addEventListener("click", function() {
    window.location.href = "links.html";
});
</script>

</body>
</html>
