<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contato | Zika Games</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #020617;
      color: #e2e8f0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 35px 20px;
      margin-bottom: 20px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00ff88, #00d9ff);
      color: #020617;
      font-size: 25px;
      font-weight: 900;
    }

    h1 {

      font-size: 30px;
      margin-bottom: 10px;
    }

    header p {
      color: #94a3b8;
    }

    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 30px 25px;
    }

    h2 {
      color: #00ff88;
      margin-bottom: 12px;
      font-size: 22px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .contact-box {
      background: #020617;
      border-radius: 14px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid #1e293b;
    }

    .contact-box strong {
      display: block;
      color: #fff;
      margin-bottom: 8px;
    }

    .email {
      color: #00d9ff;
      word-break: break-word;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 20px;
      background: #1e293b;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 25px 10px;
    }
  </style>
</head>

      <div class="logo">ZG</div>

      <h1>Entre em Contato</h1>

      <p>
        Fale com a equipe do Zika Games.
      </p>
    </header>

        e-mail.
